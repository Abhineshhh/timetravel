# Continuous Integration — runs on every push and pull request.
# Validates build, tests, vet, and cross-compile sanity for all supported platforms.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.24.x"

jobs:
  # ---------------------------------------------------------------------------
  # Lint & static analysis (fast fail before matrix builds)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go fmt (check)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt: OK"

      - name: go vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: staticcheck
        run: staticcheck ./...

      # Fail on reachable vulns in *our* modules; requires current Go (1.24+)
      # so the standard library itself is not reported as vulnerable.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # ---------------------------------------------------------------------------
  # Unit tests on multiple OS + Go versions
  # ---------------------------------------------------------------------------
  test:
    name: Test (Go ${{ matrix.go }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ["1.24.x", "1.25.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify go.mod tidy
        shell: bash
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod; then
            echo "::error::go.mod is not tidy; run go mod tidy and commit"
            exit 1
          fi
          if [ -f go.sum ]; then
            if ! git diff --exit-code go.sum; then
              echo "::error::go.sum is not tidy; run go mod tidy and commit"
              exit 1
            fi
          fi

      - name: Run tests
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            go test -count=1 -timeout 5m ./...
          else
            go test -race -count=1 -timeout 5m ./...
          fi

      - name: Run tests (coverage, ubuntu only)
        if: runner.os == 'Linux'
        run: |
          go test -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tail -1

      - name: Upload coverage artifact
        if: runner.os == 'Linux' && matrix.go == '1.24.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Build the CLI binary on each OS (smoke-compile)
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        shell: bash
        run: |
          VERSION="${{ github.sha }}"
          VERSION="${VERSION:0:8}"
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o timetravel${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/timetravel

      - name: Smoke — version
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./timetravel.exe version
          else
            ./timetravel version
          fi

      - name: Smoke — help exits 0
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./timetravel.exe help
          else
            ./timetravel help
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: timetravel-${{ runner.os }}-${{ github.sha }}
          path: |
            timetravel
            timetravel.exe
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Cross-compile all release targets without uploading (guards release.yml)
  # ---------------------------------------------------------------------------
  cross-compile:
    name: Cross-compile matrix
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Cross-compile all targets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.sha }}"
          VERSION="${VERSION:0:8}"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          targets=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
          )
          mkdir -p dist
          for t in "${targets[@]}"; do
            GOOS="${t%/*}"
            GOARCH="${t#*/}"
            ext=""
            [[ "$GOOS" == "windows" ]] && ext=".exe"
            out="dist/timetravel-${GOOS}-${GOARCH}${ext}"
            echo "Building ${out}..."
            GOOS="$GOOS" GOARCH="$GOARCH" CGO_ENABLED=0 \
              go build -trimpath -ldflags="$LDFLAGS" -o "$out" ./cmd/timetravel
          done
          ls -la dist/

      - name: Upload cross-compile artifacts
        uses: actions/upload-artifact@v4
        with:
          name: timetravel-cross-${{ github.sha }}
          path: dist/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Gate job — branch protection can require this single status check
  # ---------------------------------------------------------------------------
  ci-success:
    name: CI Success
    if: always()
    needs: [lint, test, build, cross-compile]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "test=${{ needs.test.result }}"
          echo "build=${{ needs.build.result }}"
          echo "cross-compile=${{ needs.cross-compile.result }}"
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.cross-compile.result }}" != "success" ]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed."